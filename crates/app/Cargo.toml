[package]
name = "leon"
description = "Leon: a keyboard-first desktop orchestrator for coding agents."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Syntax highlighting of the editor: a tree-sitter grammar for each common
# language (JSON comes with the base). Off, files open as plain text.
default = ["languages"]
languages = [
    "gpui-kit/tree-sitter-rust",
    "gpui-kit/tree-sitter-javascript",
    "gpui-kit/tree-sitter-typescript",
    "gpui-kit/tree-sitter-tsx",
    "gpui-kit/tree-sitter-python",
    "gpui-kit/tree-sitter-go",
    "gpui-kit/tree-sitter-toml",
    "gpui-kit/tree-sitter-yaml",
    "gpui-kit/tree-sitter-bash",
    "gpui-kit/tree-sitter-markdown",
    "gpui-kit/tree-sitter-markdown-inline",
    "gpui-kit/tree-sitter-css",
    "gpui-kit/tree-sitter-html",
    "gpui-kit/tree-sitter-c",
    "gpui-kit/tree-sitter-cpp",
    "gpui-kit/tree-sitter-lua",
    "gpui-kit/tree-sitter-make",
    "gpui-kit/tree-sitter-diff",
    "gpui-kit/tree-sitter-java",
    "gpui-kit/tree-sitter-ruby",
]

[dependencies]
leon-core.workspace = true
leon-mark.workspace = true
leon-history.workspace = true
leon-remote.workspace = true
leon-host.workspace = true
leon-link.workspace = true
leon-pty.workspace = true
leon-wire.workspace = true
leon-term.workspace = true
leon-usage.workspace = true
leon-update.workspace = true

chrono.workspace = true
flume.workspace = true
dirs.workspace = true
gpui-kit.workspace = true
# Decodes the bundled application icon: the `image` GPUI already uses.
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The Dock icon of an unbundled run: the Objective-C bridge GPUI already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSProcessInfo", "NSString"] }

# Embeds the application icon in the Windows executable (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
leon-update = { workspace = true, features = ["test-support"] }
leon-link = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
leon-mark = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
