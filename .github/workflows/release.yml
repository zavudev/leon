name: Release

# Builds, packages, signs and publishes a release when a tag `vX.Y.Z` is
# pushed. docs/RELEASING.md is the manual: numbering, secrets, runners and how
# to run a failed release again.
#
# Signing is optional. Without the Apple secrets the macOS disk images are not
# signed or notarized, without the Windows ones the executable is not signed,
# and the job summary says so. Nothing is published unless every platform
# built.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package every platform, publish nothing
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    name: Version
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-tools
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The version is the workspace's, in Cargo.toml, and nowhere else; the
      # tag has to be it.
      - name: Read the version and hold the tag to it
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="$(cargo xtask version)"
          test -n "$version"
          tag="v$version"
          publish=false
          if [ "$REF_TYPE" = "tag" ]; then
            cargo xtask check-tag "$REF_NAME"
            if [ "$EVENT" = "push" ] || [ "$DRY_RUN" = "false" ]; then
              publish=true
            fi
          elif [ "$DRY_RUN" = "false" ]; then
            echo "::error::A release is published from its tag ($tag). Run this from the tag, or as a dry run."
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, pre-release: $prerelease, publish: $publish" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest Ubuntu on offer: the binary then runs on any
          # distribution whose C library is at least that old. (A runner set in
          # RUNNER_LINUX decides the baseline instead.)
          - platform: linux-x86_64
            os: ${{ vars.RUNNER_LINUX || 'ubuntu-22.04' }}
          - platform: macos-aarch64
            os: ${{ vars.RUNNER_MACOS_ARM || 'macos-latest' }}
          - platform: macos-x86_64
            os: ${{ vars.RUNNER_MACOS_INTEL || 'macos-15-intel' }}
          - platform: windows-x86_64
            os: ${{ vars.RUNNER_WINDOWS || 'windows-latest' }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release --locked --package leon --package xtask

      # ----- Linux: the binary, with what a desktop needs to list it.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          strip target/release/leon
          mkdir -p dist work
          packaging/linux/stage.sh target/release/leon work/stage
          cd work/stage
          ../../target/release/xtask package --platform "$PLATFORM" --out-dir ../../dist \
            --input leon --input share --input INSTALL.txt --input LICENSE --input NOTICE

      # ----- macOS: the bundle; signed and notarized when the secrets are there.
      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist work
          packaging/macos/bundle.sh target/release/leon "$VERSION" work

      # Hardened runtime and a secure timestamp, which notarization demands. No
      # entitlements: Leon starts shells and agents as ordinary child
      # processes, does not generate code at run time and loads no plug-ins or
      # third-party libraries, so none of the exceptions applies.
      - name: Sign with the Developer ID (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain"
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" work/Leon.app
          codesign --verify --deep --strict --verbose=2 work/Leon.app

      - name: Notarize the bundle (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERTIFICATE == 'true' && env.HAS_APPLE_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent work/Leon.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple work/Leon.app

      - name: Say what is not signed (macOS)
        if: runner.os == 'macOS' && !(env.HAS_MACOS_CERTIFICATE == 'true' && env.HAS_APPLE_NOTARY == 'true')
        run: |
          message="The macOS build ($PLATFORM) is NOT signed and notarized: set MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY, APPLE_ID, APPLE_APP_PASSWORD and APPLE_TEAM_ID. Gatekeeper will refuse the download until the user allows it."
          echo "::warning::$message"
          {
            echo "### WARNING: unsigned macOS build ($PLATFORM)"
            echo
            echo "$message"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir work/image
          cp -R work/Leon.app work/image/
          ln -s /Applications work/image/Applications
          image="dist/leon-$VERSION-$PLATFORM.dmg"
          hdiutil create -volname "Leon" -srcfolder work/image -ov -format UDZO "$image"
          if [ "$HAS_MACOS_CERTIFICATE" = "true" ]; then
            codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$image"
            if [ "$HAS_APPLE_NOTARY" = "true" ]; then
              xcrun notarytool submit "$image" \
                --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$image"
            fi
          fi

      # ----- Windows: the executable (a window, no console, the icon embedded
      # by build.rs); signed when the certificate is there.
      - name: Sign with Authenticode (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD target\release\leon.exe
          $code = $LASTEXITCODE
          Remove-Item $pfx
          if ($code -ne 0) { exit $code }
          & $signtool.FullName verify /pa target\release\leon.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Say that the executable is not signed (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE != 'true'
        shell: bash
        run: |
          message="The Windows build is NOT signed: set WINDOWS_CERTIFICATE_PFX and WINDOWS_CERTIFICATE_PASSWORD. SmartScreen will warn before it runs."
          echo "::warning::$message"
          {
            echo "### WARNING: unsigned Windows build"
            echo
            echo "$message"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist work/stage
          cp target/release/leon.exe LICENSE NOTICE work/stage/
          cd work/stage
          ../../target/release/xtask.exe package --platform "$PLATFORM" --out-dir ../../dist \
            --input leon.exe --input LICENSE --input NOTICE

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Release
    needs: [prepare, build]
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-tools
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # Every platform's file must be there: a release that leaves one out
      # would strand that platform's users without saying so.
      - name: Check that every platform is there
        run: |
          for file in \
            "leon-$VERSION-linux-x86_64.tar.gz" \
            "leon-$VERSION-macos-aarch64.dmg" \
            "leon-$VERSION-macos-x86_64.dmg" \
            "leon-$VERSION-windows-x86_64.zip"; do
            test -s "dist/$file" || { echo "::error::$file is missing"; exit 1; }
          done

      - name: Checksums
        run: |
          cargo xtask checksums --dir dist
          cat dist/SHA256SUMS

      - name: Write the notes
        run: |
          if [ "$PUBLISH" = "true" ]; then
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md
          else
            echo "A dry run of $VERSION." > notes.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Publish the release
        if: needs.prepare.outputs.publish == 'true'
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --verify-tag --title "Leon $VERSION" \
            --notes-file notes.md "${flags[@]}"
