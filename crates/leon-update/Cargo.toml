[package]
name = "leon-update"
description = "Checks the GitHub releases of Leon for a newer version, downloads and verifies it, and installs it with a way back."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
leon-remote.workspace = true
flate2 = "1"
semver = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tar = { version = "0.4", default-features = false }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile.workspace = true

[features]
# The scripted client and the fake tools, for the application's own tests.
test-support = ["dep:tempfile"]
