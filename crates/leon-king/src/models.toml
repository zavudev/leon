# What Leon knows of model families before anyone measured anything.
#
# Talents run from 1 (poor) to 5 (the best there is), and are Leon's starting
# estimate, nothing more: King replaces them with what it finds out, in
# king-models.toml in Leon's data folder (the tool model_note), and so can you.
# No benchmark is written here: a score is only kept with its source and date.
#
# A card matches a model when its `match` is a part of the model's id or name
# (in lower case); the longest match wins.

[[model]]
match = "opus"
name = "Claude Opus"
talents = { planning = 5, architecture = 5, coding = 5, review = 5, research = 5, speed = 2, economy = 1 }
notes = "The one to plan with and to judge others' work. Too dear for routine changes."

[[model]]
match = "sonnet"
name = "Claude Sonnet"
talents = { planning = 4, architecture = 4, coding = 5, review = 4, research = 4, speed = 3, economy = 3 }
notes = "A strong default for code changes that need care."

[[model]]
match = "haiku"
name = "Claude Haiku"
talents = { planning = 2, architecture = 2, coding = 3, review = 3, research = 3, speed = 5, economy = 5 }
notes = "Quick and cheap: reading, summarising, small and clear changes."

[[model]]
match = "gpt-5"
name = "GPT-5 (Codex)"
talents = { planning = 5, architecture = 5, coding = 5, review = 5, research = 4, speed = 3, economy = 3 }
notes = "Strong at long changes and at reasoning about a codebase; effort high for plans."

[[model]]
match = "codex-mini"
